; Tarnished Vitals v4 - Elden Ring 1.17, 1.17.1, 1.17.1 JP and 1.17.2 (eldenring.exe 2.7.0.0, 2.7.1.0, 2.7.1.1, 2.7.2.0).
; Saving in NativeTweaks applies changes in game; after editing this file by hand, restart the game.
; Turning Infinite on or off always needs a restart. Use a dot for decimals: 1.5, not 1,5.
; 0 = off, 1 = on. Each resource has independent settings.
; This DLL controls HP, FP and stamina values. The separate Tarnished HUD DLL controls the bars.

[General]
Enabled=1

[Health]
Enabled=1
; Maximum example: if normal HP is 1000, multiplier 1.5 plus add 200 gives 1700 HP.
; Set ModifyMaximum=1 to use MaximumMultiplier and MaximumAdd.
ModifyMaximum=0
MaximumMultiplier=1.00
MaximumAdd=0
; Regeneration example: 5 points/s restores 50 HP in 10 seconds.
; At 1000 max HP, 1%/s adds another 10 HP/s. Both rates can be combined.
Regeneration=1
RegenPointsPerSecond=5.00
RegenPercentPerSecond=0.00
; Infinite=1 keeps HP filled. Set 0 for normal damage and regeneration.
Infinite=0

[FP]
Enabled=1
; Maximum example: 450 normal FP x 1.25 + 0 = 562 or 563 FP after rounding.
ModifyMaximum=0
MaximumMultiplier=1.00
MaximumAdd=0
; Regeneration example: 2 points/s restores 20 FP in 10 seconds.
; At 450 max FP, 1%/s adds 4.5 FP/s; with 2 points/s that is 6.5 FP/s.
Regeneration=1
RegenPointsPerSecond=2.00
RegenPercentPerSecond=0.00
; Infinite=1 refills FP continuously when used.
Infinite=0

[Stamina]
Enabled=1
; Maximum example: 181 normal stamina x 2.0 + 0 = 362 stamina.
ModifyMaximum=0
MaximumMultiplier=1.00
MaximumAdd=0
; Regeneration example: 10 points/s adds 10 stamina each second on top of normal recovery.
; At 181 max stamina, 5%/s adds 9.05 more stamina/s.
Regeneration=1
RegenPointsPerSecond=10.00
RegenPercentPerSecond=0.00
; Infinite=1 keeps stamina filled during actions.
Infinite=0

; Valid ranges: MaximumMultiplier 0.1-100; MaximumAdd 0-1000000;
; RegenPointsPerSecond 0-1000000; RegenPercentPerSecond 0-100.
; Example: to disable FP changes only, set [FP] Enabled=0.
