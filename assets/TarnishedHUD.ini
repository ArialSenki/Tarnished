; Preset: Full Length | HP 1.00 / FP 1.00 / Stamina 1.00
; Changes apply in game: Save in NativeTweaks, or edit this file (re-read about once per second).
; Use a dot for decimals: 0.75, not 0,75. Elden Ring 1.17, 1.17.1, 1.17.1 JP and 1.17.2.
; 0 = off, 1 = on. This DLL changes the visual bars only, not actual HP/FP/stamina.
; The bundled layout is calibrated for 2560x1440. Other resolutions need testing.

[General]
Enabled=1

[BarSize]
Enabled=1
; FitScreen=1 makes each Width value a fraction of the calibrated near-edge length.
; 1.00 = near the right edge; 0.75 = about three quarters; 0.50 = about half.
; Allowed range with FitScreen=1 is 0.01 to 1.00; any decimal in range works.
; Example: 0.05 uses about 5% of the calibrated bar length. 0.00 is invalid
; because it would require an infinite value limit. Use your game HUD settings to hide a bar.
FitScreen=1
; FitScreen keeps the fill linked to real HP, FP and stamina use.
; FixedWidth=1 is kept for compatibility if FitScreen is later set to 0.
FixedWidth=1

; HP example: HPWidth=1.00 uses the full calibrated length; 0.80 makes it shorter.
HPEnabled=1
HPWidth=1.00
; FP example: FPWidth=0.75 gives a shorter blue bar while HP stays long.
FPEnabled=1
FPWidth=1.00
; Stamina example: StaminaWidth=0.65 makes the green bar shorter.
StaminaEnabled=1
StaminaWidth=1.00

; Preset examples: copy the three values from any row into the active settings above.
; Full Length:       HP=1.00, FP=1.00, Stamina=1.00
; Balanced:          HP=1.00, FP=0.75, Stamina=0.65
; All Medium:        HP=0.75, FP=0.75, Stamina=0.75
; All Compact:       HP=0.50, FP=0.50, Stamina=0.50
; Near Full:         HP=0.90, FP=0.85, Stamina=0.80
; HP Focus:          HP=1.00, FP=0.65, Stamina=0.50
; FP Focus:          HP=0.75, FP=1.00, Stamina=0.70
; Stamina Focus:     HP=0.75, FP=0.65, Stamina=1.00
; Balanced Compact:  HP=0.80, FP=0.60, Stamina=0.55
; Very Compact:      HP=0.35, FP=0.30, Stamina=0.25
; Tiny Bars:         HP=0.20, FP=0.15, Stamina=0.10
; Five Percent:      HP=0.05, FP=0.05, Stamina=0.05
;
; Set the three Width values above. Keep each Enabled value at 1 for its width to apply.
; No restart needed: the new values apply about a second after saving this file.
